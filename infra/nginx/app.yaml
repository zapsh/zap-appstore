name: nginx
title: Nginx
version: [1.31.5,1.30.4,1.28.3,1.25.4]
license: Apache-2.0
homepage: https://nginx.org
platforms:
  - linux/amd64
  - linux/arm64
category: infra
description: Nginx is a web server and a reverse proxy server.
icon: nginx.png
allow_multiple_instances: 'no'
tags: [webserver]
author: zap
organization_name : zap
actions:
  build: 编译安装
scripts:
  install: install.sh
options:
  build:
    - name: OPENSSL_VERSION
      label: OpenSSL 版本
      type: select
      default: 3.5.6
      desc: 指定 OpenSSL 版本
      choices:
        - label: 3.0.16
          value: 3.0.16
        - label: 3.1.5
          value: 3.1.5
        - label: 3.5.6
          value: 3.5.6
        - label: 3.6.3
          value: 3.6.3
        - label: 4.0.1
          value: 4.0.1
    - name: MODULES
      label: 编译模块
      type: multiselect
      desc: 勾选需要额外编译进 Nginx 的模块（多个选项以空格拼接到 configure）
      choices:
        - label: http_limit_conn_module
          value: --with-http_limit_conn_module
        - label: IPv6
          value: --with-ipv6
    - name: EXTRA_CONFIG
      label: 额外 configure 参数
      type: string
      placeholder: 如 --add-module=/path --with-debug
      desc: 追加到 ./configure 的自定义参数（如第三方模块路径）
