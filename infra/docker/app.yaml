name: docker
title: Docker
version: [latest,28.5.1,27.5.1,24.0.9]
license: Apache-2.0
homepage: https://www.docker.com
platforms:
  - linux/amd64
  - linux/arm64
category: infra
description: Docker is a platform for building, shipping and running containers.
allow_multiple_instances: 'no'
tags: [docker, container, infra]
author: zap
organization_name: zap
scripts:
  install: install.sh
  uninstall: uninstall.sh
options:
  install:
    intro: >-
      Installs Docker Engine through the official convenience script (get.docker.com),
      which detects your distribution and installs via its package manager, then enables
      and starts the service. Re-running it is safe — zap's upgrade flow runs uninstall
      first, then install.
    items:
      - name: INSTALL_MIRROR
        label: 安装源
        type: select
        default: official
        desc: 官方源在国内可能较慢，可改用阿里云镜像加速下载
        choices:
          - label: get.docker.com（官方，默认）
            value: official
          - label: 阿里云镜像（Aliyun）
            value: aliyun
      - name: INSTALL_CHANNEL
        label: 发布通道
        type: select
        default: stable
        desc: stable 为稳定版；test / nightly 仅供测试环境
        choices:
          - label: stable（稳定版，默认）
            value: stable
          - label: test（预发布）
            value: test
          - label: nightly（每日构建）
            value: nightly
      - name: REGISTRY_MIRROR
        label: 镜像加速器
        type: string
        default: ''
        placeholder: 如 https://docker.m.daocloud.io
        desc: 写入 /etc/docker/daemon.json 的 registry-mirrors，留空则不配置
      - name: DATA_ROOT
        label: 数据目录
        type: string
        default: /var/lib/docker
        desc: 镜像与容器数据的存放位置
      - name: ENABLE_SERVICE
        label: 开机自启
        type: bool
        default: true
        desc: 勾选后设置开机自启并立即启动 docker 服务
      - name: JOIN_DOCKER_GROUP
        label: 免 sudo 用户
        type: string
        default: ''
        placeholder: 如 root,www（多个用英文逗号分隔）
        desc: 将这些用户加入 docker 组，无需 sudo 即可执行 docker 命令（需重新登录生效）
  uninstall:
    intro: >-
      Stops and disables the Docker service, removes the packages installed by the
      convenience script, and cleans up configuration. Image and container data under
      the data root is KEPT unless you explicitly purge it below.
    items:
      - name: PURGE_DATA
        label: 删除数据
        type: bool
        default: false
        desc: 勾选将删除 /var/lib/docker（全部镜像、容器、数据卷）与 /var/lib/containerd，不可恢复；默认保留
      - name: BACKUP_CONFIG
        label: Backup Config
        type: bool
        default: true
        desc: If checked, /etc/docker/daemon.json is copied to /root/zap_bak/docker/ before removal.
